spring:
  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

security:
  jwt:
    issuer: orderflow-user-service
    public-key-location: classpath:keys/public.pem

services:
  inventory:
    base-url: http://localhost:8082
    connect-timeout: 2s
    read-timeout: 3s