server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://${ORDER_DB_HOST:localhost}:${ORDER_DB_PORT:5432}/${ORDER_DB_NAME:orderflow_order}
    username: ${POSTGRES_USER:orderflow}
    password: ${POSTGRES_PASSWORD:orderflow}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:orderflow}
    password: ${RABBITMQ_PASSWORD:orderflow}

    publisher-confirm-type: correlated

services:
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
    connect-timeout: 2s
    read-timeout: 3s
    internal-token: ${INTERNAL_SERVICE_TOKEN:local-orderflow-internal-token-change-me}

security:
  jwt:
    issuer: orderflow-user-service
    public-key-location: file:./keys/public.pem

outbox:
  publisher:
    enabled: true
    fixed-delay-ms: 1000
    batch-size: 50
    max-attempts: 10
    stale-processing-after: 30s
    base-backoff: 1s
    max-backoff: 60s
    confirm-timeout: 5s