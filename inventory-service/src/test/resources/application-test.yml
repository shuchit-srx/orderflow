spring:
  application:
    name: inventory-service

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

security:
  jwt:
    public-key-location: classpath:keys/test-public.pem
    issuer: orderflow-user-service
  internal:
    token: test-internal-token

orderflow:
  cache:
    products:
      ttl: 500ms

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - metrics

  metrics:
    tags:
      application: ${spring.application.name}