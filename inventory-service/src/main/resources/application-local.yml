spring:
  datasource:
    url: jdbc:postgresql://${INVENTORY_DB_HOST:localhost}:${INVENTORY_DB_PORT:5432}/${INVENTORY_DB_NAME:orderflow_inventory}
    username: ${POSTGRES_USER:orderflow}
    password: ${POSTGRES_PASSWORD:orderflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
      repositories:
        enabled: false

security:
  jwt:
    issuer: orderflow-user-service
    public-key-location: file:./keys/public.pem
  internal:
    token: ${SECURITY_INTERNAL_TOKEN:local-orderflow-internal-token-change-me}

inventory:
  reservation:
    ttl-seconds: 900
    expiry-scan-ms: 60000
  cache:
    product-detail-ttl: 10m