server:
  forward-headers-strategy: framework

  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}

      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false

  swagger-ui:
    enabled: false

security:

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  rate-limit:

    enabled: ${RATE_LIMIT_ENABLED:true}

    # Safe only because production traffic reaches:
    #
    # Internet -> ALB -> API Gateway
    #
    # and the Gateway SG blocks direct Internet access.
    trust-forwarded-for: ${RATE_LIMIT_TRUST_FORWARDED_FOR:false}

    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

    login:
      max-requests: ${RATE_LIMIT_LOGIN_MAX_REQUESTS:10}

    registration:
      max-requests: ${RATE_LIMIT_REGISTRATION_MAX_REQUESTS:5}

    order-creation:
      max-requests: ${RATE_LIMIT_ORDER_MAX_REQUESTS:30}

logging:
  level:
    org.springframework.security: WARN