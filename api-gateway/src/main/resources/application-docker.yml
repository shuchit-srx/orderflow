spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-auth
              uri: http://user-service:8081
              predicates:
                - Path=/api/v1/auth/**

            - id: users
              uri: http://user-service:8081
              predicates:
                - Path=/api/v1/users/**

            - id: products
              uri: http://inventory-service:8082
              predicates:
                - Path=/api/v1/products/**

            - id: inventory
              uri: http://inventory-service:8082
              predicates:
                - Path=/api/v1/inventory/**

            - id: admin-inventory
              uri: http://inventory-service:8082
              predicates:
                - Path=/api/v1/admin/inventory/**

            - id: orders
              uri: http://order-service:8083
              predicates:
                - Path=/api/v1/orders/**

            - id: admin-orders
              uri: http://order-service:8083
              predicates:
                - Path=/api/v1/admin/orders/**