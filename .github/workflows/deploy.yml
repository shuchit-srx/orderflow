name: OrderFlow Deploy

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - OrderFlow CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: orderflow-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  PROJECT_NAME: orderflow
  ENVIRONMENT: dev

jobs:
  deploy:
    name: Deploy to ECS

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: orderflow-${{ github.run_id }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set deployment variables
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            DEPLOY_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            DEPLOY_SHA="${GITHUB_SHA}"
          fi

          echo "IMAGE_TAG=${DEPLOY_SHA}" >> "$GITHUB_ENV"
          echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> "$GITHUB_ENV"
          echo "CLUSTER=${PROJECT_NAME}-${ENVIRONMENT}-cluster" >> "$GITHUB_ENV"

          echo "Deploying commit: ${DEPLOY_SHA}"

      - name: Build and push API Gateway
        run: |
          IMAGE="${ECR_REGISTRY}/${PROJECT_NAME}/api-gateway:${IMAGE_TAG}"

          docker build \
            --platform linux/amd64 \
            -f api-gateway/Dockerfile \
            -t "${IMAGE}" \
            .

          docker push "${IMAGE}"

      - name: Build and push User Service
        run: |
          IMAGE="${ECR_REGISTRY}/${PROJECT_NAME}/user-service:${IMAGE_TAG}"

          docker build \
            --platform linux/amd64 \
            -f user-service/Dockerfile \
            -t "${IMAGE}" \
            .

          docker push "${IMAGE}"

      - name: Build and push Inventory Service
        run: |
          IMAGE="${ECR_REGISTRY}/${PROJECT_NAME}/inventory-service:${IMAGE_TAG}"

          docker build \
            --platform linux/amd64 \
            -f inventory-service/Dockerfile \
            -t "${IMAGE}" \
            .

          docker push "${IMAGE}"

      - name: Build and push Order Service
        run: |
          IMAGE="${ECR_REGISTRY}/${PROJECT_NAME}/order-service:${IMAGE_TAG}"

          docker build \
            --platform linux/amd64 \
            -f order-service/Dockerfile \
            -t "${IMAGE}" \
            .

          docker push "${IMAGE}"

      - name: Build and push Notification Service
        run: |
          IMAGE="${ECR_REGISTRY}/${PROJECT_NAME}/notification-service:${IMAGE_TAG}"

          docker build \
            --platform linux/amd64 \
            -f notification-service/Dockerfile \
            -t "${IMAGE}" \
            .

          docker push "${IMAGE}"

      - name: Discover ECS network
        run: |
          SUBNETS="$(
            aws ec2 describe-subnets \
              --filters \
                "Name=tag:Project,Values=${PROJECT_NAME}" \
                "Name=tag:Environment,Values=${ENVIRONMENT}" \
                "Name=tag:Tier,Values=public" \
              --query 'Subnets[].SubnetId' \
              --output text |
              tr '\t' ','
          )"

          SECURITY_GROUP="$(
            aws ec2 describe-security-groups \
              --filters \
                "Name=group-name,Values=${PROJECT_NAME}-${ENVIRONMENT}-ecs-sg" \
              --query 'SecurityGroups[0].GroupId' \
              --output text
          )"

          echo "PUBLIC_SUBNETS=${SUBNETS}" >> "$GITHUB_ENV"
          echo "ECS_SECURITY_GROUP=${SECURITY_GROUP}" >> "$GITHUB_ENV"

      - name: Bootstrap PostgreSQL databases
        run: |
          TASK_ARN="$(
            aws ecs run-task \
              --cluster "${CLUSTER}" \
              --launch-type FARGATE \
              --platform-version LATEST \
              --task-definition "${PROJECT_NAME}-${ENVIRONMENT}-database-bootstrap" \
              --network-configuration \
              "awsvpcConfiguration={subnets=[${PUBLIC_SUBNETS}],securityGroups=[${ECS_SECURITY_GROUP}],assignPublicIp=ENABLED}" \
              --query 'tasks[0].taskArn' \
              --output text
          )"

          if [ -z "${TASK_ARN}" ] || [ "${TASK_ARN}" = "None" ]; then
            echo "Database bootstrap task failed to start"
            exit 1
          fi

          aws ecs wait tasks-stopped \
            --cluster "${CLUSTER}" \
            --tasks "${TASK_ARN}"

          EXIT_CODE="$(
            aws ecs describe-tasks \
              --cluster "${CLUSTER}" \
              --tasks "${TASK_ARN}" \
              --query "tasks[0].containers[?name=='database-bootstrap'].exitCode | [0]" \
              --output text
          )"

          if [ "${EXIT_CODE}" != "0" ]; then
            aws ecs describe-tasks \
              --cluster "${CLUSTER}" \
              --tasks "${TASK_ARN}"

            exit 1
          fi

      - name: Deploy ECS services
        shell: bash
        run: |
          set -euo pipefail

          deploy_service() {
            SERVICE="$1"

            ECS_SERVICE="${PROJECT_NAME}-${ENVIRONMENT}-${SERVICE}"
            IMAGE="${ECR_REGISTRY}/${PROJECT_NAME}/${SERVICE}:${IMAGE_TAG}"

            CURRENT_TASK_DEFINITION="$(
              aws ecs describe-task-definition \
                --task-definition "${PROJECT_NAME}-${ENVIRONMENT}-${SERVICE}" \
                --query 'taskDefinition.taskDefinitionArn' \
                --output text
            )"

            aws ecs describe-task-definition \
              --task-definition "${CURRENT_TASK_DEFINITION}" \
              --query taskDefinition \
              > current-task-definition.json

            if [ "${SERVICE}" = "api-gateway" ]; then
              jq \
                --arg SERVICE "${SERVICE}" \
                --arg IMAGE "${IMAGE}" \
                '
                .containerDefinitions |= map(
                  if .name == $SERVICE then
                    .image = $IMAGE
                    |
                    .environment = (
                      (.environment // [])
                      | map(
                          select(
                            .name != "SECURITY_JWT_PUBLIC_KEY_LOCATION"
                            and
                            .name != "JWT_PUBLIC_KEY_PATH"
                          )
                        )
                      + [
                          {
                            "name": "SECURITY_JWT_PUBLIC_KEY_LOCATION",
                            "value": "file:/run/secrets/jwt/public.pem"
                          }
                        ]
                    )
                  else
                    .
                  end
                )
                |
                .runtimePlatform = {
                  "cpuArchitecture": "X86_64",
                  "operatingSystemFamily": "LINUX"
                }
                |
                del(
                  .taskDefinitionArn,
                  .revision,
                  .status,
                  .requiresAttributes,
                  .compatibilities,
                  .registeredAt,
                  .registeredBy
                )
                ' \
                current-task-definition.json \
                > next-task-definition.json
            else
              jq \
                --arg SERVICE "${SERVICE}" \
                --arg IMAGE "${IMAGE}" \
                '
                .containerDefinitions |= map(
                  if .name == $SERVICE then
                    .image = $IMAGE
                  else
                    .
                  end
                )
                |
                .runtimePlatform = {
                  "cpuArchitecture": "X86_64",
                  "operatingSystemFamily": "LINUX"
                }
                |
                del(
                  .taskDefinitionArn,
                  .revision,
                  .status,
                  .requiresAttributes,
                  .compatibilities,
                  .registeredAt,
                  .registeredBy
                )
                ' \
                current-task-definition.json \
                > next-task-definition.json
            fi

            NEW_TASK_DEFINITION="$(
              aws ecs register-task-definition \
                --cli-input-json file://next-task-definition.json \
                --query 'taskDefinition.taskDefinitionArn' \
                --output text
            )"

            aws ecs update-service \
              --cluster "${CLUSTER}" \
              --service "${ECS_SERVICE}" \
              --task-definition "${NEW_TASK_DEFINITION}" \
              --desired-count 1 \
              --force-new-deployment \
              > /dev/null

            echo "Deployed ${SERVICE}: ${NEW_TASK_DEFINITION}"
          }

          deploy_service user-service
          deploy_service inventory-service
          deploy_service order-service
          deploy_service notification-service
          deploy_service api-gateway

      - name: Wait for ECS services
        shell: bash
        run: |
          set +e

          SERVICES=(
            "${PROJECT_NAME}-${ENVIRONMENT}-user-service"
            "${PROJECT_NAME}-${ENVIRONMENT}-inventory-service"
            "${PROJECT_NAME}-${ENVIRONMENT}-order-service"
            "${PROJECT_NAME}-${ENVIRONMENT}-notification-service"
            "${PROJECT_NAME}-${ENVIRONMENT}-api-gateway"
          )

          aws ecs wait services-stable \
            --cluster "${CLUSTER}" \
            --services "${SERVICES[@]}"

          WAIT_STATUS=$?

          if [ "${WAIT_STATUS}" -eq 0 ]; then
            echo "All ECS services reached steady state."
            exit 0
          fi

          echo
          echo "ECS services did not reach steady state."
          echo
          echo "===== SERVICE STATUS ====="

          aws ecs describe-services \
            --cluster "${CLUSTER}" \
            --services "${SERVICES[@]}" \
            --query 'services[].{
              Service:serviceName,
              Status:status,
              Desired:desiredCount,
              Running:runningCount,
              Pending:pendingCount,
              TaskDefinition:taskDefinition,
              Deployments:deployments[].{
                Status:status,
                RolloutState:rolloutState,
                RolloutStateReason:rolloutStateReason,
                Desired:desiredCount,
                Running:runningCount,
                Pending:pendingCount,
                Failed:failedTasks
              }
            }' \
            --output json

          echo
          echo "===== RECENT SERVICE EVENTS ====="

          for SERVICE in "${SERVICES[@]}"; do
            echo
            echo "--- ${SERVICE} ---"

            aws ecs describe-services \
              --cluster "${CLUSTER}" \
              --services "${SERVICE}" \
              --query 'services[0].events[0:10].[createdAt,message]' \
              --output table
          done

          echo
          echo "===== RECENT STOPPED TASKS ====="

          for SERVICE in "${SERVICES[@]}"; do
            echo
            echo "--- ${SERVICE} ---"

            TASKS="$(
              aws ecs list-tasks \
                --cluster "${CLUSTER}" \
                --service-name "${SERVICE}" \
                --desired-status STOPPED \
                --query 'taskArns[0:5]' \
                --output text
            )"

            if [ -z "${TASKS}" ] || [ "${TASKS}" = "None" ]; then
              echo "No recent stopped tasks found."
              continue
            fi

            aws ecs describe-tasks \
              --cluster "${CLUSTER}" \
              --tasks ${TASKS} \
              --query 'tasks[].{
                Task:taskArn,
                TaskDefinition:taskDefinitionArn,
                StopCode:stopCode,
                StoppedReason:stoppedReason,
                Containers:containers[].{
                  Name:name,
                  LastStatus:lastStatus,
                  ExitCode:exitCode,
                  Reason:reason
                }
              }' \
              --output json
          done

          exit "${WAIT_STATUS}"

      - name: Verify running tasks
        run: |
          aws ecs describe-services \
            --cluster "${CLUSTER}" \
            --services \
              "${PROJECT_NAME}-${ENVIRONMENT}-user-service" \
              "${PROJECT_NAME}-${ENVIRONMENT}-inventory-service" \
              "${PROJECT_NAME}-${ENVIRONMENT}-order-service" \
              "${PROJECT_NAME}-${ENVIRONMENT}-notification-service" \
              "${PROJECT_NAME}-${ENVIRONMENT}-api-gateway" \
            --query \
            'services[].{Service:serviceName,Desired:desiredCount,Running:runningCount,Pending:pendingCount}' \
            --output table

      - name: Verify ALB target
        run: |
          TARGET_GROUP_ARN="$(
            aws elbv2 describe-target-groups \
              --names "${PROJECT_NAME}-${ENVIRONMENT}-gateway" \
              --query 'TargetGroups[0].TargetGroupArn' \
              --output text
          )"

          aws elbv2 describe-target-health \
            --target-group-arn "${TARGET_GROUP_ARN}" \
            --output table